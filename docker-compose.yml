services:
  mars-slow-demo:
    build: ./app
    restart: unless-stopped
    environment:
      DELAY_MIN_MS: "${DELAY_MIN_MS:-3000}"
      DELAY_MAX_MS: "${DELAY_MAX_MS:-8000}"
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mars-slow-demo
